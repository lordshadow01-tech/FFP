<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>FF PAYALUGA</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="dashboard">
  <canvas id="particles"></canvas>
  <div class="scanline"></div>
  <header class="topbar">
    <h1 class="title small">FFP</h1>
    <button class="icon-btn" id="menuBtn" aria-label="Menu">⋮</button>
    <div class="menu" id="menu" hidden></div>
  </header>
  <main class="app">
    <section class="view" id="v-home">
      <div class="card hud center"><div class="clock" id="clock">--:--:--</div><p class="sub" id="onlineCount"></p></div>
      <div class="card hud"><h2>Next alarm</h2><div id="nextAlarm" class="sub">No alarm set</div></div>
      <div class="stats" id="stats"></div>
      <div class="card"><h2>Latest announcement</h2><div id="latestNews" class="sub">Nothing yet</div></div>
    </section>
    <section class="view" id="v-alarms" hidden>
      <form class="card hud" id="alarmForm" hidden novalidate>
        <h2 id="formTitle">Create alarm</h2>
        <label>Title<input id="aTitle" maxlength="40" required></label>
        <label>Time (24h)<input id="aTime" type="time" required></label>
        <label>Description<input id="aDesc" maxlength="120"></label>
        <p class="msg" id="aMsg" role="alert"></p>
        <button class="btn" type="submit" id="aSave">Save alarm</button>
        <button class="btn ghost" type="button" id="aCancel" hidden>Cancel edit</button>
      </form>
      <h2 class="head">History</h2>
      <div id="alarmList" class="list"></div>
    </section>
    <section class="view" id="v-members" hidden><div id="memberList" class="list"></div></section>
    <section class="view" id="v-news" hidden>
      <form class="card" id="newsForm" hidden novalidate>
        <label>Announcement<input id="nText" maxlength="200" required></label>
        <button class="btn" type="submit">Post</button>
      </form>
      <div id="newsList" class="list"></div>
    </section>
    <section class="view" id="v-settings" hidden>
      <div class="card hud">
        <button class="btn" id="notifBtn" type="button">Enable alarm notifications</button>
        <button class="btn ghost" id="soundBtn" type="button">Test alarm sound</button>
        <button class="btn ghost" id="installBtn" type="button" hidden>Install app</button>
        <p class="msg" id="sMsg"></p>
      </div>
    </section>
  </main>
  <nav class="nav" id="nav">
    <button data-v="home" class="on">Home</button><button data-v="alarms">Alarms</button>
    <button data-v="members">Members</button><button data-v="news">News</button><button data-v="settings">Settings</button>
  </nav>
  <div class="ring" id="ring" hidden>
    <div class="radar"><span class="radar-sweep"></span><span class="radar-ring r1"></span><span class="radar-dot"></span></div>
    <h2 class="logo" id="ringTitle"></h2><p class="sub" id="ringDesc"></p>
    <div class="two"><button class="btn" id="bComing">COMING</button><button class="btn warn" id="bVarala">VARALA</button></div>
  </div>
  <script type="module" src="dashboard.js"></script>
</body>
</html>
